[project]
name = "ai-lead-triage"
version = "0.1.0"
description = "Classify inbound leads and extract structured fields with an LLM, ready for n8n/Zapier."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic[email]>=2.7",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lead_triage"]

[tool.pytest.ini_options]
pythonpath = ["src"]
